name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Create local.properties (Clave API falsa)
      run: echo "GEMINI_API_KEYS=clave_falsa_12345" > local.properties

    - name: Create google-services.json (Archivo Firebase falso)
      run: |
        echo '{"project_info":{"project_number":"0","project_id":"p","storage_bucket":"b"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.ayush.blurr"}},"api_key":[{"current_key":"k"}]}]}' > app/google-services.json

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle (Ignorando errores)
      run: ./gradlew assembleDebug -x lint --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
